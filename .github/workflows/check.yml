name: Content check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Refuse game files, keys and generated game code
        run: python tools/check_content.py
      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: End-to-end test on a fake game
        run: python tests/test_extract.py
      - name: RomFS index test
        run: python tests/test_romfs.py
      - name: Phase report test
        run: python tests/test_phases.py
      - name: Install clang, lld and LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: Lifter differential test (AArch64 guest lifted, run on x86-64, compared with native)
        run: python tests/lifter/test_lifter.py
